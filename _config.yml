# ============================================================
# 新媒体交互设计 · 课程讲义 — Jekyll 配置（just-the-docs 主题）
# 部署地址：https://featon0526.github.io/blog/
# ============================================================

# ---- 站点基本信息 ----
title: 新媒体交互设计 · 课程讲义
description: >-
  《新媒体交互设计》课程全套讲义（第1讲—第8讲），涵盖交互设计基础、Agent 基础、
  AI 视频剪辑、WorkBuddy 使用指南、案例讲解与互联网发展史等。
baseurl: "/blog"          # 项目页子路径（仓库名 blog）
url: "https://featon0526.github.io"
author: featon            # 作者（用于 SEO）
footer_content: "Copyright © 2026 featon · 新媒体交互设计讲义"
social:
  github: featon0526

# ---- 主题 ----
theme: just-the-docs

# ---- 侧边栏 / 搜索 / 配色 ----
search_enabled: true

# 配色方案：只支持内置的 "light"（默认）与 "dark"，或你在 _sass/color_schemes/
# 下自建的方案名。写成不存在的名字（如 default）会让 Sass 执行
# @import "./color_schemes/default" 而找不到文件，导致整个站点构建失败。
# 顶栏的浅色/深色切换按钮由 _includes/header_custom.html 提供（调用 jtd.setTheme）。
color_scheme: light

# ---- 文档集合（讲义）----
# 文件放在 docs/ 目录，按 nav_order 在侧边栏排序
collections:
  docs:
    output: true
    # 注意：实测此处（集合级）的 permalink 不生效，会被忽略并回退成 /docs/xx.html。
    # 各讲的真实 URL 由每篇 front matter 的 permalink 决定（见 docs/*.md，如 /01-course-intro/）。
    permalink: /:path/

# ---- 右上角辅助链接 ----
aux_links:
  "课程作品展示":
    - "https://nwu-newmedia-2026.pages.dev/"

# ---- RSS（jekyll-feed）----
feed:
  path: feed.xml
  posts_limit: 100
  collections:
    - docs

# ---- 插件 ----
plugins:
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-feed
